version: '3.8'

services:
  # ==========================================================
  # 1. Gateway Nginx (Entrypoint Port 7025)
  #    Memilah request: /api & /docs ke FastAPI, lainnya ke Streamlit
  # ==========================================================
  tugasku_gateway:
    image: nginx:alpine
    container_name: tugasku_gateway
    restart: always
    ports:
      - "7025:7025"    # Port 7025 luar tetap sama, tidak perlu ubah firewall / Cloudflare
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - tugasku
      - tugasku_api

  # ==========================================================
  # 2. Aplikasi Dashboard Streamlit
  # ==========================================================
  tugasku:
    build: .
    container_name: tugasku_app
    restart: always
    expose:
      - "8501"         # Diakses oleh tugasku_gateway di internal network
    volumes:
      - ./database_jadwal.json:/app/database_jadwal.json
      - ./token.pickle:/app/token.pickle
    environment:
      - TZ=Asia/Jakarta
      - GOOGLE_REDIRECT_URI=https://jadwal.sman1margaasih.sch.id/

  # ==========================================================
  # 3. REST API FastAPI
  # ==========================================================
  tugasku_api:
    build: .
    container_name: tugasku_api
    restart: always
    ports:
      - "8000:8000"    # Opsional: Jika ingin akses port 8000 langsung
    expose:
      - "8000"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./database_jadwal.json:/app/database_jadwal.json
    environment:
      - TZ=Asia/Jakarta
